<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .items-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .item-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .company {
      font-weight: bold;
      color: #555;
    }

    .item-name {
      margin: 6px 0;
      font-size: 16px;
    }

    .price {
      margin: 8px 0;
      color: #333;
    }

    .price span {
      margin-right: 8px;
    }

    .discount {
      color: green;
    }

    .rating {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
    }

    .add-to-cart {
      margin-top: 10px;
      padding: 8px;
      background: #ff3e6c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .add-to-cart:hover {
      background: #e5375d;
    }
  </style>
</head>
<body>

  <h1>Our Products</h1>
  <div class="items-container" id="itemsContainer">
    <!-- Product cards will be injected here -->
  </div>

  <script>
    let items = []; // Define globally to access anywhere

    async function fetchAndFormatItems() {
      try {
        const response = await fetch('https://dummyjson.com/products?limit=1000');
        const data = await response.json();
    
        items = data.products.map(product => ({
          id: product.id.toString().padStart(3, '0'),
          image: product.thumbnail,
          company: product.brand,
          item_name: product.title,
          original_price: product.price + 200,
          current_price: product.price,
          discount_percentage: Math.floor((200 / (product.price + 200)) * 100),
          return_period: 14,
          delivery_date: '10 Oct 2023',
          rating: {
            stars: parseFloat(product.rating.toFixed(1)),
            count: Math.floor(Math.random() * 10000)
          }
        }));
    
        console.log('Formatted Items:', items); // Confirm it's working
    
      } catch (error) {
        console.error('Error fetching items:', error);
      }
    }
    fetchAndFormatItems();
  </script>
</body>
</html>
